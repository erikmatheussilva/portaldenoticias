<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Portal de Notícias</title>
  </head>
  <body>
    <header class="container">
      <nav class="padding-block-20">
        <a href="" class="menu">
          <img src="assets/icons/List.svg" class="icon-default" alt="Menu" />
          Menu
        </a>

        <h1 class="logo">TECH NEWS</h1>

        <a href="" class="search">
          <img
            src="assets/icons/MagnifyingGlass.svg"
            class="icon-default"
            alt="Search"
          />
          Buscar
        </a>
      </nav>

      <nav>
        <a href="">Inteligência Artificial</a>
        <a href="">Blockchain</a>
        <a href="">Hologramas</a>
        <a href="">Internet</a>
        <a href="">Vestíveis</a>
        <a href="">Realidade Aumentada</a>
        <a href="">Realidade Virtual</a>
      </nav>
    </header>

    <main class="container">
      <section class="highlights grid col">
        <figure class="highlight">
          <img class="image" src="assets/images/image1.png" alt="" />
          <figcaption>
            <span class="tag">Robótica</span>
            <h1 class="--heading1">
              Robôs domésticos começam a ser adotados para tarefas diárias,
              prometendo mais conforto e eficiência nas residências.
            </h1>
          </figcaption>
        </figure>

        <div class="other-highlights grid">
          <figure class="highlight">
            <img class="image" src="assets/images/image2.png" alt="" />
            <figcaption>
              <span class="tag">Hologramas</span>
              <h2>
                Novo Smartphone Projetor 3D chega ao mercado, transformando a
                forma como vemos nossas telas!
              </h2>
            </figcaption>
          </figure>

          <figure class="highlight">
            <img class="image" src="assets/images/image3.png" alt="" />
            <figcaption>
              <span class="tag">Internet</span>
              <h2>
                Tecnologia 6G chega às metrópoles brasileiras, prometendo
                revolucionar a forma como vivemos e nos comunicamos.
              </h2>
            </figcaption>
          </figure>

          <figure class="highlight">
            <img class="image" src="assets/images/image4.png" alt="" />
            <figcaption>
              <span class="tag">Vestíveis</span>
              <h2>
                Empresa lança relógio inteligente capaz de monitorar a saúde
                mental, oferecendo insights valiosos para o bem-estar pessoal.
              </h2>
            </figcaption>
          </figure>

          <figure class="highlight">
            <img class="image" src="assets/images/image5.png" alt="" />
            <figcaption>
              <span class="tag">Realidade Virtual</span>
              <h2>
                Escolas adotam a tecnologia VR para proporcionar experiências
                imersivas, transformando a aprendizagem tradicional.
              </h2>
            </figcaption>
          </figure>
        </div>
      </section>
      <div id="divider"></div>

      <section class="weekly">
        <header class="grid col gap-16">
          <h3>Mais lidas da semana</h3>
          <a href="" class="grid col">
            <strong> Ver tudo</strong>
            <span></span>
          </a>
        </header>

        <div class="grid col gap-16">
          <figure class="weekly-card">
            <span class="tag">veículos</span>
            <img src="assets/images/image6.png" alt="" />
            <p>
              Protótipo de veículo voador é apresentado, marcando o início da
              era dos transportes aéreos pessoa...
            </p>
          </figure>
          <figure class="weekly-card">
            <span class="tag">hologramas</span>
            <img src="assets/images/image7.png" alt="" />
            <p>
              Plataforma de videoconferência apresenta nova função de
              hologramas, tornando as chamada...
            </p>
          </figure>
          <figure class="weekly-card">
            <span class="tag">Realidade virtual</span>
            <img src="assets/images/image8.png" alt="" />
            <p>
              Nova geração de consoles de videogame é lançada, trazendo gráficos
              ultra-realistas e experiên...
            </p>
          </figure>
          <figure class="weekly-card">
            <span class="tag">internet</span>
            <img src="assets/images/image9.png" alt="" />
            <p>
              Projeto busca oferecer internet de alta velocidade em áreas
              remotas através de satélites.
            </p>
          </figure>
        </div>
      </section>
      <section class="ai">
        <div id="divider"></div>
        <header class="grid col gap-16">
          <h3>Destaques de Inteligência Artificial</h3>
          <a href="" class="grid col">
            <strong> Ver tudo</strong>
            <span></span>
          </a>
        </header>
      </section>
    </main>
  </body>
</html>
